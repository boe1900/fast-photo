[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/core",
    "crates/ai",
    "crates/common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Image processing
image = "0.25"

# EXIF
kamadak-exif = "0.5"

# File watching
notify = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# S3 storage
rust-s3 = { version = "0.35", features = ["tokio-rustls-tls"], default-features = false }

# HTTP client (for WebDAV)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Async trait
async-trait = "0.1"
